<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王喆楷 · 个人简历</title>
<meta name="description" content="王喆楷的个人简历 —— 上海杉达学院计算机科学与技术专业在读，在 GitHub 上持续记录学习与项目实践。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a5fb4'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' font-weight='bold' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1b18;
    --soft: #5f5e59;
    --faint: #a3a29c;
    --line: #e6e4dc;
    --accent: #1a5fb4;
    --accent-soft: #eef3fb;
    --bg: #f5f3ee;
    --sans: "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --serif: "Noto Serif SC", "Songti SC", Georgia, serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    color: var(--ink); background: var(--bg);
    font-size: 15px; line-height: 1.75; font-weight: 300;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--accent-soft); }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  .wrap { max-width: 780px; margin: 0 auto; padding: 0 28px; }

  /* 头部 */
  header { padding: 104px 0 56px; }
  .profile { display: flex; align-items: center; gap: 32px; }
  .avatar {
    width: 112px; height: 112px; border-radius: 50%;
    object-fit: cover; border: 1px solid var(--line); flex-shrink: 0;
    background: #f7f7f5;
  }
  .who h1 {
    font-family: var(--serif);
    font-size: 40px; font-weight: 600; letter-spacing: 1px; line-height: 1.2;
  }
  .who .role { color: var(--soft); font-size: 15px; margin-top: 8px; font-weight: 400; }
  .who .link { margin-top: 18px; }
  .who .link a {
    display: inline-block; font-size: 13px; color: var(--soft); font-weight: 400;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 15px;
    transition: color .2s, border-color .2s;
  }
  .who .link a:hover { color: var(--accent); border-color: var(--accent); }

  .lead { margin-top: 38px; max-width: 60ch; color: var(--soft); font-size: 15.5px; }

  /* 区块 */
  section { padding: 60px 0; border-bottom: 1px solid var(--line); }
  .label {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; letter-spacing: 3px; color: var(--accent);
    font-weight: 500; text-transform: uppercase; margin-bottom: 32px;
  }
  .label::before { content: ""; width: 18px; height: 1px; background: var(--accent); flex: none; }
  h2.title { font-size: 20px; font-weight: 500; margin-bottom: 16px; }

  /* 键值行 */
  .rows { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 16px; align-items: baseline; }
  .row .k { color: var(--faint); font-size: 13.5px; width: 84px; flex-shrink: 0; letter-spacing: 2px; }
  .row .v { font-size: 15px; font-weight: 400; }
  .row .v a { color: var(--accent); }
  .row .v a:hover { text-decoration: underline; }

  /* 兴趣标签 */
  .tags { display: flex; flex-wrap: wrap; gap: 10px; }
  .tags span {
    font-size: 13.5px; padding: 6px 16px; border-radius: 999px;
    background: #f7f7f5; color: #46453f; font-weight: 400;
  }

  /* 同步说明 */
  .sync { font-size: 12.5px; color: var(--faint); margin-bottom: 24px; letter-spacing: .5px; }

  /* 精选作品 */
  .works { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .work {
    position: relative;
    display: flex; flex-direction: column; gap: 10px;
    padding: 22px 20px 20px; border: 1px solid var(--line); border-radius: 16px;
    background: #fff;
    transition: transform .25s ease, border-color .25s, box-shadow .25s;
  }
  .work:hover {
    transform: translateY(-4px); border-color: #c9dbf2;
    box-shadow: 0 10px 24px rgba(27, 60, 110, .07);
  }
  .work::after {
    content: "↗"; position: absolute; top: 15px; right: 18px;
    font-size: 13px; color: var(--accent);
    opacity: 0; transform: translate(-3px, 3px);
    transition: opacity .25s, transform .25s;
  }
  .work:hover::after { opacity: 1; transform: none; }
  .work .w-tag {
    width: fit-content; font-size: 11.5px; padding: 3px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); letter-spacing: .5px; font-weight: 500;
  }
  .work h3 {
    font-family: var(--serif); font-size: 16px; font-weight: 600; line-height: 1.5;
    padding-right: 16px;
  }
  .work p {
    color: var(--soft); font-size: 13px; line-height: 1.7; font-weight: 300;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .work .w-meta {
    margin-top: auto; padding-top: 6px; font-size: 11.5px; color: var(--faint);
    display: flex; gap: 12px; flex-wrap: wrap; letter-spacing: .5px;
  }

  /* GitHub 项目 */
  .repo {
    display: block; position: relative;
    margin: 0 -16px; padding: 18px 16px; border-top: 1px solid var(--line);
    border-radius: 12px; transition: background .2s;
  }
  .repo:first-of-type { border-top: none; }
  .repo:hover { background: #ffffff; }
  .repo .name {
    font-size: 15px; font-weight: 500; color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px; transition: color .2s;
  }
  .repo .name::after {
    content: "↗"; font-size: 11px; color: var(--faint);
    opacity: 0; transition: opacity .2s;
  }
  .repo:hover .name { color: var(--accent); }
  .repo:hover .name::after { opacity: 1; }
  .repo .desc { color: var(--soft); font-size: 13.5px; margin: 4px 0 8px; font-weight: 300; }
  .repo .meta {
    font-size: 12px; color: var(--faint);
    display: flex; gap: 16px; flex-wrap: wrap; letter-spacing: .3px;
  }
  .repo .lang { display: inline-flex; align-items: center; gap: 5px; }
  .lang-dot { width: 8px; height: 8px; border-radius: 50%; background: #999; display: inline-block; }
  .empty { color: var(--faint); font-size: 14px; }

  /* 页脚 */
  footer { padding: 46px 0 76px; color: var(--faint); font-size: 12.5px; text-align: center; letter-spacing: 1px; }

  @media (max-width: 640px) {
    .works { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 0 22px; }
    header { padding: 72px 0 44px; }
    .profile { flex-direction: column; align-items: flex-start; gap: 20px; }
    .avatar { width: 88px; height: 88px; }
    .who h1 { font-size: 32px; }
    .row { flex-direction: column; gap: 2px; }
    .row .k { width: auto; }
    section { padding: 48px 0; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="profile">
      <img class="avatar" src="assets/photo.jpg" alt="王喆楷">
      <div class="who">
        <h1>王喆楷</h1>
        <div class="role">上海杉达学院 · 计算机科学与技术</div>
        <div class="link"><a href="https://github.com/wzk-12138" target="_blank" rel="noopener">GitHub · wzk-12138</a></div>
      </div>
    </div>
    <p class="lead">计算机专业在读，热爱运动与魔方。在 GitHub 上持续记录学习与项目实践，用代码解决问题，也用热爱点亮日常。</p>
  </header>

  <section>
    <div class="label">About</div>
    <div class="rows">
      <div class="row"><div class="k">专业</div><div class="v">计算机科学与技术（本科在读）</div></div>
      <div class="row"><div class="k">学校</div><div class="v">上海杉达学院</div></div>
      <div class="row"><div class="k">兴趣</div><div class="v">运动、魔方、编程实践</div></div>
    </div>
  </section>

  <section>
    <div class="label">Interests</div>
    <div class="tags">
      <span>🏃 热爱运动</span>
      <span>🧩 魔方</span>
      <span>💻 编程</span>
      <span>🎓 计算机科学</span>
    </div>
  </section>

  <section id="works-section">
    <div class="label">Works</div>
    <div class="works" id="featured"></div>
  </section>

  <section>
    <div class="label">GitHub Projects</div>
    <p class="sync" id="sync">正在同步 GitHub 项目…</p>
    <div id="repos"><div class="empty">加载中…</div></div>
  </section>

  <section style="border-bottom:none;">
    <div class="label">Contact</div>
    <div class="rows">
      <div class="row"><div class="k">GitHub</div><div class="v"><a href="https://github.com/wzk-12138" target="_blank" rel="noopener">github.com/wzk-12138</a></div></div>
      <div class="row"><div class="k">邮箱</div><div class="v"><a href="mailto:168463192@qq.com">168463192@qq.com</a></div></div>
    </div>
  </section>

  <footer>© 2026 王喆楷</footer>

</div>

<script>
const GH_USER = "wzk-12138";
const FEATURED_COUNT = 3;   // 精选作品数量
const EXCLUDE = ["batchmatmulmaxsum"];   // 手动排除：这些仓库不出现在简历页任何区块
const FEATURED_EXCLUDE = ["deploy-guide"];   // 不进精选作品（仍会出现在下方项目列表）
const LANG = {JavaScript:"#f1e05a",TypeScript:"#3178c6",Python:"#3572A5",Java:"#b07219",
  "C":"#555","C++":"#f34b7d","C#":"#178600",Go:"#00ADD8",Rust:"#dea584",
  HTML:"#e34c26",CSS:"#563d7c",Vue:"#41b883",Shell:"#89e051",PHP:"#4F5D95"};

const repoBox = document.getElementById("repos");
const sync = document.getElementById("sync");

// 本地兜底数据：实时拉取失败时使用，保证页面始终有内容
const FALLBACK = [];

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// 自己的项目：排除 fork、简历仓库自身与手动排除的仓库
function myRepos(repos) {
  return repos.filter(r => !r.fork && r.name !== "resume" && EXCLUDE.indexOf(r.name) === -1);
}

// 代表性评分：有介绍 +3、有主语言 +1、越新越高（约半年衰减完）、star/fork 加分
function featuredScore(r) {
  let s = 0;
  if (r.description) s += 3;
  if (r.language) s += 1;
  const days = (Date.now() - new Date(r.updated_at).getTime()) / 86400000;
  s += Math.max(0, 3 - days / 120);
  s += Math.min(r.stargazers_count || 0, 5);
  s += Math.min(r.forks_count || 0, 3);
  return s;
}

// 从描述开头截一个短标题（不超过 14 字），截不到就用仓库名
function shortTitle(r) {
  const head = (r.description || "").split(/[，。、；：｜|·—]|\s-\s/)[0].trim();
  return head && head.length <= 14 ? head : r.name;
}

// 卡片描述：与标题重合的前缀去掉，避免标题和描述重复
function cardDesc(r) {
  const desc = (r.description || "").trim();
  const title = shortTitle(r);
  if (title !== r.name && desc.indexOf(title) === 0) {
    const rest = desc.slice(title.length).replace(/^[\s，。、；：｜|·—\-]+/, "").trim();
    return rest || desc;
  }
  return desc;
}

// 选 n 个代表性作品：按分排序，同语言只取一个（保证覆盖面），不足再按分补齐
function pickFeatured(repos, n) {
  const scored = myRepos(repos)
    .filter(r => FEATURED_EXCLUDE.indexOf(r.name) === -1)
    .map(r => ({ r: r, s: featuredScore(r) }))
    .sort((a, b) => b.s - a.s);
  const picked = [];
  const usedLang = new Set();
  for (const item of scored) {
    if (picked.length >= n) break;
    const r = item.r;
    if (r.language && usedLang.has(r.language)) continue;
    picked.push(r);
    if (r.language) usedLang.add(r.language);
  }
  for (const item of scored) {
    if (picked.length >= n) break;
    if (picked.indexOf(item.r) === -1) picked.push(item.r);
  }
  return picked;
}

function renderFeatured(repos, live) {
  const section = document.getElementById("works-section");
  const box = document.getElementById("featured");
  const picked = live ? pickFeatured(repos, FEATURED_COUNT) : [];
  if (!picked.length) { section.style.display = "none"; return; }
  box.innerHTML = picked.map(r => `
    <a class="work" href="${r.html_url}" target="_blank" rel="noopener">
      <span class="w-tag">${escapeHtml(r.language || "Project")}</span>
      <h3>${escapeHtml(shortTitle(r))}</h3>
      <p>${escapeHtml(cardDesc(r) || "（暂无描述）")}</p>
      <div class="w-meta">
        ${r.stargazers_count ? `<span>★ ${r.stargazers_count}</span>` : ""}
        <span>更新于 ${new Date(r.updated_at).toLocaleDateString("zh-CN")}</span>
      </div>
    </a>`).join("");
}

function renderProjects(repos, live) {
  // 简历仓库自身不作为作品项目列出
  const mine = myRepos(repos);
  if (!mine.length) {
    repoBox.innerHTML = '<div class="empty">暂无公开仓库，去 GitHub 创建第一个项目吧。</div>';
  } else {
    repoBox.innerHTML = mine.map(r => `
        <a class="repo" href="${r.html_url}" target="_blank" rel="noopener">
          <div class="name">${escapeHtml(r.name)}</div>
          <div class="desc">${escapeHtml(r.description || "（暂无描述）")}</div>
          <div class="meta">
            ${r.language ? `<span class="lang"><span class="lang-dot" style="background:${LANG[r.language]||"#999"}"></span>${escapeHtml(r.language)}</span>` : ""}
            <span>★ ${r.stargazers_count}</span>
            <span>⑂ ${r.forks_count}</span>
            <span>更新于 ${new Date(r.updated_at).toLocaleDateString("zh-CN")}</span>
          </div>
        </a>`).join("");
  }
  sync.textContent = live
    ? `已实时同步 · 共 ${mine.length} 个项目 · 更新于 ${new Date().toLocaleTimeString("zh-CN")}`
    : `已显示缓存数据（实时拉取失败，可刷新重试）· 共 ${mine.length} 个项目`;
}

fetch(`https://api.github.com/users/${GH_USER}/repos?sort=updated&per_page=50`)
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(repos => { renderFeatured(repos, true); renderProjects(repos, true); })
  .catch(() => { renderFeatured(FALLBACK, false); renderProjects(FALLBACK, false); });
</script>
</body>
</html>
