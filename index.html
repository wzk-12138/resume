<style>
  :root {
    --ink: #1b1b18;
    --soft: #5f5e59;
    --faint: #a3a29c;
    --line: #e8e5dc;
    --card-line: #eae7de;
    --accent: #1a5fb4;
    --accent-deep: #134a8e;
    --accent-soft: #eef3fb;
    --bg: #f5f3ee;
    --sans: "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --serif: "Noto Serif SC", "Songti SC", Georgia, serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    color: var(--ink); background: var(--bg);
    font-size: 15px; line-height: 1.75; font-weight: 300;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: #dfe9f8; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  .wrap { max-width: 820px; margin: 0 auto; padding: 0 28px 90px; }

  /* 滚动渐入 */
  html.js .reveal {
    opacity: 0; transform: translateY(18px);
    transition: opacity .7s cubic-bezier(.22,.61,.36,1), transform .7s cubic-bezier(.22,.61,.36,1);
  }
  html.js .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    html.js .reveal { opacity: 1; transform: none; transition: none; }
  }

  /* Hero */
  .hero {
    position: relative; overflow: hidden;
    margin-top: 44px; padding: 54px 44px 38px;
    border-radius: 28px; border: 1px solid #e9e5da;
    background: linear-gradient(150deg, #fffefb 0%, #f2efe7 100%);

  .hero::before, .hero::after {
    content: ""; position: absolute; border-radius: 50%; pointer-events: none;
  }
  .hero::before {
    width: 480px; height: 480px; right: -190px; top: -230px;
    background: radial-gradient(circle, rgba(26, 95, 180, .13), rgba(26, 95, 180, 0) 65%);
  }
  .hero::after {
    width: 400px; height: 400px; left: -160px; bottom: -240px;
    background: radial-gradient(circle, rgba(186, 146, 84, .16), rgba(186, 146, 84, 0) 65%);
  }
  .hero > * { position: relative; }
  .profile { display: flex; align-items: center; gap: 30px; }
  .avatar {
    width: 116px; height: 116px; border-radius: 50%;
    object-fit: cover; flex-shrink: 0;
    border: 4px solid rgba(255, 255, 255, .92);

    background: #efece2;
  }
  .who h1 {
    font-family: var(--serif);

  .links { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .pill {
    font-size: 12.5px; padding: 6px 15px; border-radius: 999px;
    border: 1px solid rgba(27, 27, 24, .14); color: var(--soft);
    background: rgba(255, 255, 255, .72);

  .pill:hover { color: var(--accent); border-color: var(--accent); }
  .pill.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pill.accent:hover { background: var(--accent-deep); border-color: var(--accent-deep); color: #fff; }

  .lead { margin-top: 34px; max-width: 58ch; color: var(--soft); font-size: 15.5px; }

  .stats {
    margin-top: 28px; padding-top: 22px; border-top: 1px solid rgba(27, 27, 24, .08);

  }
  .stats span { display: inline-flex; align-items: baseline; gap: 6px; }
  .stats b { font-family: var(--serif); font-size: 21px; font-weight: 600; color: var(--ink); letter-spacing: .5px; }

  /* 区块 */
  section { padding: 58px 0 0; }
  .label {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; letter-spacing: 3px; color: var(--accent);
    font-weight: 500; text-transform: uppercase; margin-bottom: 26px;

  .label::before { content: ""; width: 18px; height: 1px; background: var(--accent); flex: none; }
  .label::after { content: ""; flex: 1; height: 1px; background: rgba(27, 27, 24, .08); }

  /* 信息卡片 */
  .facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .fact {
    background: #fff; border: 1px solid var(--card-line); border-radius: 14px;
    padding: 16px 18px; display: flex; flex-direction: column; gap: 3px;

  .fact:hover { transform: translateY(-2px); border-color: #dcd7c9; box-shadow: 0 8px 18px rgba(40, 40, 30, .05); }
  .fact .f-k { font-size: 11.5px; color: var(--faint); letter-spacing: 2px; }

  /* 兴趣标签 */
  .tags { display: flex; flex-wrap: wrap; gap: 10px; }
  .tags span {
    font-size: 13.5px; padding: 7px 17px; border-radius: 999px;

  .tags span:hover { transform: translateY(-2px); border-color: #c9dbf2; color: var(--accent); }

  /* 同步说明 */

  /* 语言分布 */
  .langbox { margin-bottom: 22px; }
  .langbox .bar {
    display: flex; height: 9px; border-radius: 999px; overflow: hidden;

  .langbox .seg { height: 100%; transition: width .6s ease; }
  .langbox .seg + .seg { box-shadow: inset 2px 0 0 #f5f3ee; }
  .langbox .legend {
    display: flex; gap: 18px; margin-top: 10px;

  .langbox .lg { display: inline-flex; align-items: center; gap: 6px; }

  /* 精选作品 */
  .works { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .work {
    position: relative; display: flex; flex-direction: column; gap: 10px;

  .work .w-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .work .w-tag {
    display: inline-flex; align-items: center; gap: 6px;

  .work .w-tag i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .work .w-num { font-family: var(--serif); font-size: 13px; color: #cdc9bc; letter-spacing: 1px; }
  .work h3 { font-family: var(--serif); font-size: 16.5px; font-weight: 600; line-height: 1.5; }
  .work p {
    color: var(--soft); font-size: 13px; line-height: 1.7; font-weight: 300;

  }
  .work .w-meta {
    margin-top: auto; padding-top: 6px; font-size: 11.5px; color: var(--faint);
    display: flex; gap: 12px; flex-wrap: wrap; letter-spacing: .3px;
  }

  /* GitHub 项目卡片 */
  #repos { display: flex; flex-direction: column; gap: 10px; }
  .repo {
    display: block; background: #fff; border: 1px solid var(--card-line);
    border-radius: 14px; padding: 16px 18px;
    transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .repo:hover { transform: translateY(-2px); border-color: #c9dbf2; box-shadow: 0 8px 20px rgba(27, 60, 110, .06); }
  .repo .name {
    font-size: 15px; font-weight: 500; color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px; transition: color .2s;
  }
  .repo .name::after { content: "↗"; font-size: 11px; color: var(--faint); opacity: 0; transition: opacity .2s; }
  .repo:hover .name { color: var(--accent); }
  .repo:hover .name::after { opacity: 1; }
  .repo .desc { color: var(--soft); font-size: 13.5px; margin: 4px 0 8px; font-weight: 300; }
  .repo .meta {
    font-size: 12px; color: var(--faint);
    display: flex; gap: 16px; flex-wrap: wrap; letter-spacing: .2px;
  }
  .repo .lang { display: inline-flex; align-items: center; gap: 5px; }
  .lang-dot { width: 8px; height: 8px; border-radius: 50%; background: #999; display: inline-block; }
  .empty { color: var(--faint); font-size: 14px; }

  /* 联系方式卡片 */
  .contacts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .contact {
    display: flex; align-items: center; gap: 14px;
    background: #fff; border: 1px solid var(--card-line); border-radius: 14px;
    padding: 16px 18px; transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .contact:hover { transform: translateY(-2px); border-color: #c9dbf2; box-shadow: 0 8px 18px rgba(27, 60, 110, .06); }
  .contact .c-k { font-size: 11.5px; color: var(--faint); letter-spacing: 2px; }
  .contact .c-v { font-size: 13.5px; margin-left: auto; color: var(--ink); }
  .contact:hover .c-v { color: var(--accent); }

  /* 页脚 */
  footer {
    padding: 48px 0 10px; color: var(--faint);
    font-size: 12.5px; text-align: center; letter-spacing: 1px;
  }

  @media (max-width: 700px) {
    .works { grid-template-columns: 1fr; }
    .facts, .contacts { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 0 20px 70px; }

    .stats b { font-size: 18px; }

  }
</style>

<script>
const GH_USER = "wzk-12138";
const FEATURED_COUNT = 3;   // 精选作品数量
const EXCLUDE = ["resume"];   // 手动排除：这些仓库不出现在简历页任何区块（resume 是简历仓库自身）
const FEATURED_EXCLUDE = ["batchmatmulmaxsum", "deploy-guide"];   // 不进精选作品（仍会出现在下方项目列表）
const LANG = {JavaScript:"#f1e05a",TypeScript:"#3178c6",Python:"#3572A5",Java:"#b07219",
  "C":"#555","C++":"#f34b7d","C#":"#178600",Go:"#00ADD8","Rust":"#dea584",
  HTML:"#e34c26",CSS:"#563d7c","Vue":"#41b883",Shell:"#89e051",PHP:"#4F5D95"};

const repoBox = document.getElementById("repos");
const sync = document.getElementById("sync");

// 本地兜底数据：实时拉取失败时使用，保证页面始终有内容
const FALLBACK = [];

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// 自己的项目：排除 fork 与手动排除名单，其余（含简历仓库自身）全部展示
function myRepos(repos) {
  return repos.filter(r => !r.fork && EXCLUDE.indexOf(r.name) === -1);
}

// 代表性评分：有介绍 +3、有主语言 +1、越新越高（约半年衰减完）、star/fork 加分
function featuredScore(r) {
  let s = 0;
  if (r.description) s += 3;
  if (r.language) s += 1;
  const days = (Date.now() - new Date(r.updated_at).getTime()) / 86400000;
  s += Math.max(0, 3 - days / 120);
  s += Math.min(r.stargazers_count || 0, 5);
  s += Math.min(r.forks_count || 0, 3);
  return s;
}

// 从描述开头截一个短标题（不超过 14 字），截不到就用仓库名
function shortTitle(r) {
  const head = (r.description || "").split(/[，。、；：｜|·—]|\s-\s/)[0].trim();
  return head && head.length <= 14 ? head : r.name;
}

// 卡片描述：与标题重合的前缀去掉，避免标题和描述重复
function cardDesc(r) {
  const desc = (r.description || "").trim();
  const title = shortTitle(r);
  if (title !== r.name && desc.indexOf(title) === 0) {
    const rest = desc.slice(title.length).replace(/^[\s，。、；：｜|·—\-]+/, "").trim();
    return rest || desc;
  }
  return desc;
}

// 选 n 个代表性作品：按分排序，同语言只取一个（保证覆盖面），不足再按分补齐
function pickFeatured(repos, n) {
  const scored = myRepos(repos)
    .filter(r => FEATURED_EXCLUDE.indexOf(r.name) === -1)
    .map(r => ({ r: r, s: featuredScore(r) }))
    .sort((a, b) => b.s - a.s);
  const picked = [];
  const usedLang = new Set();
  for (const item of scored) {
    if (picked.length >= n) break;
    const r = item.r;
    if (r.language && usedLang.has(r.language)) continue;
    picked.push(r);
    if (r.language) usedLang.add(r.language);
  }
  for (const item of scored) {
    if (picked.length >= n) break;
    if (picked.indexOf(item.r) === -1) picked.push(item.r);
  }
  return picked;
}

function renderFeatured(repos, live) {
  const section = document.getElementById("works-section");
  const box = document.getElementById("featured");
  const picked = live ? pickFeatured(repos, FEATURED_COUNT) : [];
  if (!picked.length) { section.style.display = "none"; return; }
  box.innerHTML = picked.map((r, i) => `
    <a class="work" href="${r.html_url}" target="_blank" rel="noopener">
      <div class="w-top">
        <span class="w-tag"><i style="background:${LANG[r.language] || "#999"}"></i>${escapeHtml(r.language || "Project")}</span>
        <span class="w-num">0${i + 1}</span>
      </div>
      <h3>${escapeHtml(shortTitle(r))}</h3>
      <p>${escapeHtml(cardDesc(r) || "（暂无描述）")}</p>
      <div class="w-meta">
        ${r.stargazers_count ? `<span>★ ${r.stargazers_count}</span>` : ""}
        <span>更新于 ${new Date(r.updated_at).toLocaleDateString("zh-CN")}</span>
      </div>
    </a>`).join("");
}

// Hero 下方的一行统计
function renderStats(repos) {
  const el = document.getElementById("stats");
  const mine = myRepos(repos);
  if (!mine.length) return;
  const langs = new Set(mine.map(r => r.language).filter(Boolean));
  const latest = mine
    .map(r => new Date(r.updated_at))
    .sort((a, b) => b - a)[0];
  el.innerHTML =
    `<span><b>${mine.length}</b> 个公开项目</span>` +
    `<span><b>${langs.size}</b> 种语言</span>` +
    `<span>最近更新于 <b>${latest.toLocaleDateString("zh-CN")}</b></span>`;
}

// 语言分布条
function renderLangBox(repos) {
  const box = document.getElementById("langbox");
  const mine = myRepos(repos);
  if (!mine.length) return;
  const count = {};
  mine.forEach(r => {
    const k = r.language || "其他";
    count[k] = (count[k] || 0) + 1;
  });
  const items = Object.keys(count)
    .map(k => [k, count[k]])
    .sort((a, b) => b[1] - a[1]);
  const total = mine.length;
  box.innerHTML =
    '<div class="bar">' +
      items.map(([lang, n]) =>
        `<span class="seg" style="width:${(n / total * 100).toFixed(2)}%;background:${LANG[lang] || "#b8b6ae"}"></span>`
      ).join("") +
    '</div>' +
    '<div class="legend">' +
      items.map(([lang, n]) =>
        `<span class="lg"><i style="background:${LANG[lang] || "#b8b6ae"}"></i>${escapeHtml(lang)} <em>${n}</em></span>`
      ).join("") +
    '</div>';
}

function renderProjects(repos, live) {
  // 展示 GitHub 上全部公开仓库（含简历仓库自身）
  const mine = myRepos(repos);
  if (!mine.length) {
    repoBox.innerHTML = '<div class="empty">暂无公开仓库，去 GitHub 创建第一个项目吧。</div>';
  } else {
    repoBox.innerHTML = mine.map(r => `
        <a class="repo" href="${r.html_url}" target="_blank" rel="noopener">
          <div class="name">${escapeHtml(r.name)}</div>
          <div class="desc">${escapeHtml(r.description || "（暂无描述）")}</div>
          <div class="meta">
            ${r.language ? `<span class="lang"><span class="lang-dot" style="background:${LANG[r.language]||"#999"}"></span>${escapeHtml(r.language)}</span>` : ""}
            <span>★ ${r.stargazers_count}</span>
            <span>⑂ ${r.forks_count}</span>
            <span>更新于 ${new Date(r.updated_at).toLocaleDateString("zh-CN")}</span>
          </div>
        </a>`).join("");
  }
  sync.textContent = live
    ? `已实时同步 · 共 ${mine.length} 个项目 · 更新于 ${new Date().toLocaleTimeString("zh-CN")}`
    : `已显示缓存数据（实时拉取失败，可刷新重试）· 共 ${mine.length} 个项目`;
}

// 滚动渐入
(function setupReveal() {
  const els = Array.prototype.slice.call(document.querySelectorAll(".reveal"));
  if (!("IntersectionObserver" in window)) {
    els.forEach(el => el.classList.add("in"));
    return;
  }
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) {
        en.target.classList.add("in");
        io.unobserve(en.target);
      }
    });
  }, { threshold: 0.1, rootMargin: "0px 0px -40px 0px" });
  els.forEach(el => io.observe(el));
})();

fetch(`https://api.github.com/users/${GH_USER}/repos?sort=updated&per_page=50`)
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(repos => {
    renderFeatured(repos, true);
    renderStats(repos);
    renderLangBox(repos);
    renderProjects(repos, true);
  })
  .catch(() => { renderFeatured(FALLBACK, false); renderProjects(FALLBACK, false); });
</script>
